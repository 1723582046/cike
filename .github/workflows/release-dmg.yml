name: Build and Release DMG

"on":
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.5.11)'
        required: true
        default: '0.5.11'

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Package macOS app
        run: |
          npx electron-packager . CIKE \
            --platform=darwin --arch=arm64 \
            --icon=electron/assets/icon.icns \
            --out=dist --overwrite --prune \
            '--ignore=^/(test|.browsers|dist)'
      - name: Create DMG
        run: |
          brew install create-dmg
          mkdir -p dmg-staging
          cp -R dist/CIKE-darwin-arm64/CIKE.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          create-dmg --volname "CIKE" "CIKE-${{ inputs.version }}-mac-arm64.dmg" dmg-staging/
          ls -lh *.dmg
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: CIKE v${{ inputs.version }}
          files: "*.dmg"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
