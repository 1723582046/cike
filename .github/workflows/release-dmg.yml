name: Build and Release DMG

"on":
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.5.11)'
        required: true
        default: '0.5.11'

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: |
          cd electron
          npm install
          npx electron-packager . CIKE --platform=darwin --arch=arm64 --icon=assets/icon.icns --overwrite
      - run: |
          brew install create-dmg
          cd electron
          mkdir -p dmg-staging
          cp -R dist/CIKE-darwin-arm64/CIKE.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          create-dmg --volname "CIKE" "CIKE-${{ inputs.version }}-mac-arm64.dmg" dmg-staging/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: CIKE v${{ inputs.version }}
          files: electron/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
