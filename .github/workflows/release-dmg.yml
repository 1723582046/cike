name: Build and Release DMG

"on":
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.5.11)'
        required: true
        default: '0.5.13'

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Set release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
      - run: npm ci
      - name: Package macOS app
        run: |
          test -s electron/assets/icon.icns
          npx electron-packager . CIKE \
            --platform=darwin --arch=arm64 \
            --icon=electron/assets/icon.icns \
            --out=dist --overwrite --prune \
            '--ignore=^/(test|.browsers|dist)'
      - name: Verify packaged icon
        run: |
          ICON_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/CIKE-darwin-arm64/CIKE.app/Contents/Info.plist)
          cmp electron/assets/icon.icns "dist/CIKE-darwin-arm64/CIKE.app/Contents/Resources/$ICON_NAME"
      - name: Ad-hoc sign and verify app
        run: |
          codesign --force --deep --sign - dist/CIKE-darwin-arm64/CIKE.app
          codesign --verify --deep --strict --verbose=2 dist/CIKE-darwin-arm64/CIKE.app
      - name: Create DMG
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          brew install create-dmg
          mkdir -p dmg-staging
          cp -R dist/CIKE-darwin-arm64/CIKE.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          create-dmg --volname "CIKE" "CIKE-${RELEASE_VERSION}-mac-arm64.dmg" dmg-staging/
          hdiutil verify "CIKE-${RELEASE_VERSION}-mac-arm64.dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/cike-verify" "CIKE-${RELEASE_VERSION}-mac-arm64.dmg"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/cike-verify/CIKE.app"
          hdiutil detach "$RUNNER_TEMP/cike-verify"
          shasum -a 256 *.dmg > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: CIKE v${{ inputs.version }}
          body: |
            免费临时签名版本，未经过苹果开发者签名和公证。
            适用于苹果 M 系列芯片、macOS 13 及以上。
            安装后首次打开如被阻止，请前往「系统设置 → 隐私与安全性」选择「仍要打开」。
            完整安装说明及无法放行时的处理方法见仓库 README。
          files: |
            *.dmg
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
